name: CI-CD Aplikasi Digital Kampus

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test

  security-scan:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: '1'

  docker-image:
    if: github.event_name == 'push'
    needs: [build-test, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t app-akademik:${{ github.sha }} .

  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    needs: docker-image
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo 'Deploy ke staging'

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: docker-image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo 'Deploy ke production'
